# Projects listed in the sidebar dropdown and on /projects/.
# Add a new entry here to publish another GitHub Pages project. An entry with
# `items` is a group: it shows as a heading with its items nested underneath.
- title: Biochemical Pathways Poster
  url: /biochemical-pathways-poster/
  repo: https://github.com/usnish/biochemical-pathways-poster
  image: /biochemical-pathways-poster/poster_thumb.jpg
