# Projects listed in the sidebar dropdown and on /projects/.
# Add a new entry here to publish another GitHub Pages project. An entry with
# `items` is a group: it shows as a heading with its items nested underneath.
- title: Biochemical Pathways Poster
  url: /biochemical-pathways-poster/
  repo: https://github.com/usnish/biochemical-pathways-poster
  image: /biochemical-pathways-poster/poster_thumb.jpg
  description: Printable, high-resolution renders of Roche's Biochemical Pathways (Part 1, Metabolic Pathways) poster, preserved from biochemical-pathways.com before it went offline.

- title: Data Visualizations
  items:
    - title: Cardiac Rehab Participation by Region and State
      url: /cardiac-rehab-map/
      repo: https://github.com/usnish/usnish.github.io/tree/master/cardiac-rehab-map
      description: Interactive D3 map of cardiac rehabilitation participation among eligible Medicare patients, by region (2016 CDC data) and by state (1997).

    - title: Cardiac Rehab Eligibility by County
      url: /cr-eligibility-map/
      repo: https://github.com/usnish/usnish.github.io/tree/master/cr-eligibility-map
      description: County map of conditions that qualify patients for cardiac rehab (CR-eligible events, heart attack, coronary heart disease and heart failure), CR participation among eligible Medicare patients, and national participation trends since 1997.

    - title: The Dialysis Time Tax
      url: /dialysis-time-tax/
      repo: https://github.com/usnish/usnish.github.io/tree/master/dialysis-time-tax
      description: How many hours a year people on in-center dialysis spend just driving to treatment, county by county, and where households have no car to make the trip.

    - title: Clinical Trial Deserts
      url: /trial-deserts/
      repo: https://github.com/usnish/usnish.github.io/tree/master/trial-deserts
      description: Who lives within an hour of a recruiting clinical trial for diabetes, coronary heart disease, cancer or COPD, broken down by race, social vulnerability and rurality.

    - title: Nonprofit Hospital Charity Care
      url: /hospital-charity-care/
      repo: https://github.com/usnish/usnish.github.io/tree/master/hospital-charity-care
      description: Charity care reported by 2,700 U.S. nonprofit hospitals in 2023, plotted against a rough estimate of each hospital's federal income tax exemption.

    - title: How Much More Medicare Pays for Medicare Advantage
      url: /medicare-advantage-payments/
      repo: https://github.com/usnish/usnish.github.io/tree/master/medicare-advantage-payments
      description: A step-by-step breakdown of MedPAC's estimate that Medicare will pay $76 billion more in 2026 for Medicare Advantage enrollees than traditional Medicare would have spent on them.
